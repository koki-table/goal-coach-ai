name = "goal-coach-ai-api"
main = "src/index.ts"
compatibility_date = "2025-05-26"

[vars]
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001,https://goal-coach.app,https://www.goal-coach.app"
FRONTEND_URL = "https://goal-coach.app"
# STRIPE_PRICE_ID_MONTHLY / STRIPE_PRICE_ID_YEARLY はStripeダッシュボードでPrice作成後にここへ追加する(非シークレット)
# STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET は `wrangler secret put` で設定する(シークレットのためvarsに書かない)
STRIPE_PRICE_ID_MONTHLY = "price_1U3Fw68hwib0cKNrlaVWMNYo"
STRIPE_PRICE_ID_YEARLY = "price_1U3Fw78hwib0cKNr0d2y5ArV"

[[d1_databases]]
binding = "DB"
database_name = "goal-coach-db"
database_id = "4fe0d296-9230-4f14-bea1-aa3ad5cd668b"
migrations_dir = "drizzle/migrations"

[[routes]]
pattern = "api.goal-coach.app"
custom_domain = true

# デイリータスクの完了チェックを毎日リセット（UTC 15:00 = JST 0:00）
[triggers]
crons = ["0 15 * * *"]
